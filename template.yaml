AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  AWS Access Key Anomaly Detection - IAM Access Key(AKIA) 유출 및 이상행위를
  CloudTrail 이벤트 기반으로 실시간 탐지하고 Slack으로 알림을 발송하는 보안 모니터링 시스템

Parameters:
  SlackChannelId:
    Type: String
    Description: 알림을 발송할 Slack 채널 또는 DM ID

  SlackSecretName:
    Type: String
    Default: security-event-app-token
    Description: "Slack Bot Token이 저장된 Secrets Manager 시크릿 이름 (키: slack_bot_token). 사전에 생성되어 있어야 합니다."

  MaxmindSecretName:
    Type: String
    Description: "MaxMind License Key가 저장된 Secrets Manager 시크릿 이름 (키: MAXMIND_LICENSE_KEY). 사전에 생성되어 있어야 합니다."

  AllowedCountries:
    Type: String
    Default: KR
    Description: 정상 접근으로 간주할 국가 코드 (콤마 구분)

  AllowedRegions:
    Type: String
    Default: ap-northeast-2
    Description: 정상 접근으로 간주할 AWS 리전 (콤마 구분)

  ErrorThreshold:
    Type: Number
    Default: 5
    Description: 시나리오 3 - 시간 윈도우 내 AccessDenied 임계값

  ErrorWindowMin:
    Type: Number
    Default: 5
    Description: 시나리오 3 - 탐지 시간 윈도우 (분)

  AlertCooldownMinutes:
    Type: Number
    Default: 30
    Description: 동일 Access Key에서 동일 IP로 반복되는 알림을 억제하는 쿨다운 시간 (분)

  CloudTrailBucketArn:
    Type: String
    Description: >
      Log Archive 계정 CloudTrail 중앙 S3 버킷의 ARN. ref-table-processor에 대한
      cross-account S3 invoke 권한(Lambda Permission)을 부여하는 데 사용됩니다.
      실제 S3 Event Notification 설정은 Log Archive 계정 쪽에서 별도로 진행해야 합니다.

  CloudTrailBucketAccountId:
    Type: String
    Description: Log Archive 계정 ID (cross-account invoke 권한의 SourceAccount 검증용)

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    MemorySize: 256
    Timeout: 30

Resources:
  # -----------------------------------------------------------------------
  # DynamoDB Reference Tables (공통 키 - PK accessKeyId / SK eventTime#eventId)
  # -----------------------------------------------------------------------

  RefAwsApiTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: accessKeyId
          AttributeType: S
        - AttributeName: eventTime#eventId
          AttributeType: S
      KeySchema:
        - AttributeName: accessKeyId
          KeyType: HASH
        - AttributeName: eventTime#eventId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_IMAGE

  RefErrorEventTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: accessKeyId
          AttributeType: S
        - AttributeName: eventTime#eventId
          AttributeType: S
      KeySchema:
        - AttributeName: accessKeyId
          KeyType: HASH
        - AttributeName: eventTime#eventId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_IMAGE

  RefIpCountryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: accessKeyId
          AttributeType: S
        - AttributeName: eventTime#eventId
          AttributeType: S
      KeySchema:
        - AttributeName: accessKeyId
          KeyType: HASH
        - AttributeName: eventTime#eventId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  RefRegionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: accessKeyId
          AttributeType: S
        - AttributeName: eventTime#eventId
          AttributeType: S
      KeySchema:
        - AttributeName: accessKeyId
          KeyType: HASH
        - AttributeName: eventTime#eventId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  RefUserAgentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: accessKeyId
          AttributeType: S
        - AttributeName: eventTime#eventId
          AttributeType: S
      KeySchema:
        - AttributeName: accessKeyId
          KeyType: HASH
        - AttributeName: eventTime#eventId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  RefAlertCooldownTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: alertKey
          AttributeType: S
      KeySchema:
        - AttributeName: alertKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # -----------------------------------------------------------------------
  # Lambda: ref-table-processor
  # CloudTrail 로그 파일을 파싱하여 AKIA Access Key 이벤트만 Reference Table에 적재
  # -----------------------------------------------------------------------

  RefTableProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-ref-table-processor
      CodeUri: lambda/ref-table-processor/
      Handler: ref-table-processor.lambda_handler
      Timeout: 60
      Environment:
        Variables:
          ERROR_EVENT_TABLE: !Ref RefErrorEventTable
          IP_COUNTRY_TABLE: !Ref RefIpCountryTable
          AWS_API_TABLE: !Ref RefAwsApiTable
          REGION_TABLE: !Ref RefRegionTable
          USER_AGENT_TABLE: !Ref RefUserAgentTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref RefErrorEventTable
        - DynamoDBWritePolicy:
            TableName: !Ref RefIpCountryTable
        - DynamoDBWritePolicy:
            TableName: !Ref RefAwsApiTable
        - DynamoDBWritePolicy:
            TableName: !Ref RefRegionTable
        - DynamoDBWritePolicy:
            TableName: !Ref RefUserAgentTable
      # NOTE: geoip-mmdb Lambda Layer는 이 템플릿이 아니라 geoip-layer-builder 함수가
      # 런타임에 UpdateFunctionConfiguration API로 직접 연결합니다 (SETUP.md 참고).
      # 여기서 Layers 속성을 선언하지 않아야 재배포 시 값이 초기화되지 않습니다.

  RefTableProcessorS3InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RefTableProcessorFunction
      Principal: s3.amazonaws.com
      SourceArn: !Ref CloudTrailBucketArn
      SourceAccount: !Ref CloudTrailBucketAccountId

  # -----------------------------------------------------------------------
  # Lambda: ref-suspicious-detector
  # DynamoDB Streams(ref_aws_api, ref_error_event) INSERT 이벤트로 탐지 시나리오 평가 및 Slack 알림
  # -----------------------------------------------------------------------

  RefSuspiciousDetectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-ref-suspicious-detector
      CodeUri: lambda/ref-suspicious-detector/
      Handler: ref-suspicious-detector.lambda_handler
      Timeout: 30
      Environment:
        Variables:
          SLACK_CHANNEL_ID: !Ref SlackChannelId
          SLACK_SECRET_NAME: !Ref SlackSecretName
          ALLOWED_COUNTRIES: !Ref AllowedCountries
          ALLOWED_REGIONS: !Ref AllowedRegions
          ERROR_THRESHOLD: !Ref ErrorThreshold
          ERROR_WINDOW_MIN: !Ref ErrorWindowMin
          ALERT_COOLDOWN_MIN: !Ref AlertCooldownMinutes
          AWS_API_TABLE: !Ref RefAwsApiTable
          IP_COUNTRY_TABLE: !Ref RefIpCountryTable
          REGION_TABLE: !Ref RefRegionTable
          USER_AGENT_TABLE: !Ref RefUserAgentTable
          ERROR_EVENT_TABLE: !Ref RefErrorEventTable
          ALERT_COOLDOWN_TABLE: !Ref RefAlertCooldownTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RefAwsApiTable
        - DynamoDBReadPolicy:
            TableName: !Ref RefErrorEventTable
        - DynamoDBReadPolicy:
            TableName: !Ref RefIpCountryTable
        - DynamoDBReadPolicy:
            TableName: !Ref RefRegionTable
        - DynamoDBReadPolicy:
            TableName: !Ref RefUserAgentTable
        - DynamoDBReadPolicy:
            TableName: !Ref RefAlertCooldownTable
        - DynamoDBWritePolicy:
            TableName: !Ref RefAlertCooldownTable
        - Statement:
            - Sid: DynamoDBStreamRead
              Effect: Allow
              Action:
                - dynamodb:GetRecords
                - dynamodb:GetShardIterator
                - dynamodb:DescribeStream
                - dynamodb:ListStreams
              Resource:
                - !GetAtt RefAwsApiTable.StreamArn
                - !GetAtt RefErrorEventTable.StreamArn
        - Statement:
            - Sid: SlackSecretRead
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SlackSecretName}-*"
      Events:
        RefAwsApiStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt RefAwsApiTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumRetryAttempts: 3
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName": ["INSERT"]}'
        RefErrorEventStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt RefErrorEventTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumRetryAttempts: 3
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName": ["INSERT"]}'

  # -----------------------------------------------------------------------
  # Lambda: geoip-layer-builder
  # MaxMind GeoLite2-City DB 최신 버전을 주기적으로 확인해 geoip-mmdb Layer로 발행,
  # ref-table-processor에 자동 연결
  # -----------------------------------------------------------------------

  GeoipLayerBuilderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-geoip-layer-builder
      CodeUri: lambda/geoip-layer-builder/
      Handler: geoip-layer-builder.lambda_handler
      Timeout: 120
      MemorySize: 512
      EphemeralStorage:
        Size: 1024
      Environment:
        Variables:
          SECRET_NAME: !Ref MaxmindSecretName
          LAYER_NAME: !Sub ${AWS::StackName}-geoip-mmdb
          TARGET_FUNCTION_NAME: !Ref RefTableProcessorFunction
      Policies:
        - Statement:
            - Sid: MaxmindSecretRead
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${MaxmindSecretName}-*"
            - Sid: GeoipLayerPublish
              Effect: Allow
              Action:
                - lambda:ListLayerVersions
                - lambda:PublishLayerVersion
              Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:layer:${AWS::StackName}-geoip-mmdb"
            - Sid: UpdateProcessorLayer
              Effect: Allow
              Action:
                - lambda:GetFunctionConfiguration
                - lambda:UpdateFunctionConfiguration
              Resource: !GetAtt RefTableProcessorFunction.Arn
      Events:
        WeeklySchedule:
          Type: Schedule
          Properties:
            Schedule: rate(7 days)
            Enabled: true

Outputs:
  RefTableProcessorFunctionArn:
    Description: ref-table-processor Lambda ARN (Log Archive 계정 S3 알림 대상)
    Value: !GetAtt RefTableProcessorFunction.Arn

  RefSuspiciousDetectorFunctionArn:
    Description: ref-suspicious-detector Lambda ARN
    Value: !GetAtt RefSuspiciousDetectorFunction.Arn

  GeoipLayerBuilderFunctionArn:
    Description: geoip-layer-builder Lambda ARN (최초 배포 후 수동 1회 실행 필요)
    Value: !GetAtt GeoipLayerBuilderFunction.Arn

  RefAwsApiTableName:
    Value: !Ref RefAwsApiTable
  RefErrorEventTableName:
    Value: !Ref RefErrorEventTable
  RefIpCountryTableName:
    Value: !Ref RefIpCountryTable
  RefRegionTableName:
    Value: !Ref RefRegionTable
  RefUserAgentTableName:
    Value: !Ref RefUserAgentTable
  RefAlertCooldownTableName:
    Value: !Ref RefAlertCooldownTable
